<!DOCTYPE html>
<html>
<head>
    <title>Payroll Management</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Payroll Management System</h1>

    <div>
        <label>Month:</label>
        <input type="number" id="month" min="1" max="12">

        <label>Year:</label>
        <input type="number" id="year">

        <button onclick="runPayroll()">
            Run Payroll
        </button>

        <button onclick="getPayroll()">
            Get Payroll
        </button>
    </div>

    <br>

    <div id="message"></div>

    <br>

    <table id="payrollTable" border="1">
        <thead>
            <tr>
                <th>Employee Name</th>
                <th>Basic Salary</th>
                <th>Working Days</th>
                <th>Days Present</th>
                <th>Gross Pay</th>
                <th>PF Deduction</th>
                <th>Professional Tax</th>
                <th>Net Pay</th>
            </tr>
        </thead>

        <tbody></tbody>
    </table>

    <script src="app.js"></script>

</body>
</html>
